<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varjo</title>
<link rel="stylesheet" href="styles/palette.css">
<style>
  :root { color-scheme: dark; }
  body {
    width: 260px; margin: 0; padding: 14px 16px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: var(--varjo-bg); color: var(--varjo-fg);
  }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 0 0 14px; color: var(--varjo-comment); font-size: 11.5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--varjo-bg-lighter); }
  label { color: var(--varjo-fg); }
  select, button {
    font: inherit; color: var(--varjo-fg); background: var(--varjo-bg-light);
    border: 1px solid var(--varjo-bg-lighter); border-radius: 7px; padding: 4px 8px;
  }
  button { cursor: pointer; width: 100%; margin-top: 12px; padding: 7px; }
  button:hover { background: var(--varjo-bg-lighter); }
  .sw { display: flex; gap: 4px; margin-top: 12px; }
  .sw i { flex: 1; height: 7px; border-radius: 3px; }
  input[type=checkbox] { accent-color: var(--varjo-purple); width: 15px; height: 15px; }
  .host { color: var(--varjo-cyan); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <h1>Varjo for the Web</h1>
  <p class="sub" id="host">—</p>

  <div class="row">
    <label for="enabled">Enabled</label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label for="mode">Scope</label>
    <select id="mode">
      <option value="sites">Tuned sites only</option>
      <option value="all">Every site</option>
    </select>
  </div>
  <div class="row">
    <label for="site">Allow this site</label>
    <input type="checkbox" id="site">
  </div>

  <button id="reload">Apply &amp; reload tab</button>

  <div class="sw">
    <i style="background:var(--varjo-cyan)"></i>
    <i style="background:var(--varjo-green)"></i>
    <i style="background:var(--varjo-yellow)"></i>
    <i style="background:var(--varjo-orange)"></i>
    <i style="background:var(--varjo-pink)"></i>
    <i style="background:var(--varjo-purple)"></i>
    <i style="background:var(--varjo-red)"></i>
  </div>
  <script src="popup.js"></script>
</body>
</html>
